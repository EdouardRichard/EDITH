# A per-test ceiling, because this module's clock is injected: a plugin path that waits on a monotonic deadline gets
# no help from wall time, so a defect there presents as a build that never finishes rather than a red test. The first
# run of `ModelSummarizerTest` did exactly that. Real tests here finish in milliseconds, so 20 s is generous.
# A per-test ceiling, because this module's clock is injected: a plugin path that waits on a monotonic deadline gets
# no help from wall time, so a defect there presents as a build that never finishes rather than a red test. The first
# run of `ModelSummarizerTest` did exactly that (a stream with no terminal against a clock that only moved when the
# test said so). Real tests here finish in milliseconds, so 20 s is generous.
junit.jupiter.execution.timeout.default = 20 s
