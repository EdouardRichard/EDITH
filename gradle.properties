org.gradle.jvmargs=-Xmx4g -XX:+HeapDumpOnOutOfMemoryError

# LiteRT 2.2.0 only: `litert` and its dependency `litert-api` both declare the namespace
# `com.google.ai.edge.litert`, and AGP 9.x stops the build at processDebugMainManifest over it
# (google-ai-edge/LiteRT issue 8474; AGP 8.x only warns, which is why the publisher's sample — on
# AGP 8.9.1 — never needed this). The publisher's own LiteRT skill documents `uniquePackageNames=false`
# as the fix for 2.2.0 and 2.1.6, and warns to remove it on 2.3.0.
#
# Remove this line when the project moves to 2.3.0, which is not possible yet: 2.3.0's `litert-api`
# carries Kotlin 2.4.0 metadata that this project's Kotlin 2.2.20 cannot read. Keeping the flag longer
# than necessary is not free — it also silences this clash between any other pair of libraries.
android.uniquePackageNames=false
