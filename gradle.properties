org.gradle.jvmargs=-Xmx4g -XX:+HeapDumpOnOutOfMemoryError

# `android.uniquePackageNames=false` lived here while the project was on LiteRT 2.2.0: `litert` and `litert-api`
# both declared the namespace `com.google.ai.edge.litert`, and AGP 9.x stops the build at
# processDebugMainManifest over it (google-ai-edge/LiteRT issue 8474). 2.3.0 moved the implementation into
# `com.google.ai.edge.litert.impl`, so the clash is gone and the flag has been removed as its own comment
# instructed — it also silences this check between any other pair of libraries, which is not worth keeping.
